name: Ranked Phase 3 security checks
on:
  push:
    branches: [feature/server-verified-ranking-phase3]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check dist/app.js
      - run: node --check dist/ranked-client.js
      - run: node --check api/_ranked-common.js
      - run: node --check api/ranked-start.js
      - run: node --check api/ranked-step.js
      - run: node test.cjs
      - run: node qa-speedrun.cjs
      - run: node test-auth.cjs
      - run: node qa-phase3.cjs
