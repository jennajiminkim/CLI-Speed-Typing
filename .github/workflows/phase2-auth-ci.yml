name: Invite Auth Phase 2 CI
on:
  push:
    branches: [feature/invite-auth-phase2]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/app.js
      - run: node --check dist/invite-auth.js
      - run: node --check dist/leaderboard.js
      - run: node --check api/public-config.js
      - run: node test.cjs
      - run: node qa-speedrun.cjs
      - run: node test-auth.cjs
